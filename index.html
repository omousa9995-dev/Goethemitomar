<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a7a3e" />
  <title>Goethe mit Omar</title>
  <link rel="stylesheet" href="style.css?v=12" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner">
    <div class="logo" onclick="showSection('dashboard')"><span class="logo-icon">🇩🇪</span><div><div class="logo-title">Goethe mit Omar</div><div class="logo-sub">من الصفر إلى B2</div></div></div>
    <div class="header-progress"><div class="progress-info"><span id="overall-percent">0%</span><span class="progress-label">التقدم</span></div><div class="progress-bar"><div class="progress-fill" id="overall-bar" style="width:0%"></div></div></div>
  </div></header>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-section="dashboard" onclick="showSection('dashboard')"><span class="nav-icon">🏠</span><span>رئيسية</span></button>
    <button class="nav-btn" data-section="lessons" onclick="showSection('lessons')"><span class="nav-icon">📚</span><span>دروس</span></button>
    <button class="nav-btn" data-section="stories" onclick="showSection('stories')"><span class="nav-icon">📖</span><span>قراءة</span></button>
    <button class="nav-btn" data-section="redemittel" onclick="showSection('redemittel')"><span class="nav-icon">💬</span><span>عبارات</span></button>
    <button class="nav-btn" data-section="exams" onclick="showSection('exams')"><span class="nav-icon">📝</span><span>امتحانات</span></button>
    <button class="nav-btn" data-section="resources" onclick="showSection('resources')"><span class="nav-icon">🔗</span><span>موارد</span></button>
    <button class="nav-btn" data-section="wordbank" onclick="showSection('wordbank')"><span class="nav-icon">🃏</span><span>بنك</span></button>
    <button class="nav-btn" data-section="scan" onclick="showSection('scan')"><span class="nav-icon">🔍</span><span>Scan</span></button>
  </nav>
  <main class="main">
    <section id="dashboard" class="section active">
      <div class="welcome-card"><h1>مرحباً بك 👋</h1><p class="welcome-text">هدفك: <strong>B2</strong> · منهج Goethe</p>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="streak-count">0</div><div class="stat-label">أيام</div></div>
          <div class="stat-card"><div class="stat-value" id="lessons-done">0</div><div class="stat-label">دروس</div></div>
          <div class="stat-card"><div class="stat-value" id="words-learned">0</div><div class="stat-label">كلمات</div></div>
          <div class="stat-card"><div class="stat-value" id="days-left">210</div><div class="stat-label">متبقي</div></div>
        </div>
      </div>
      <div class="card"><h2>📅 درس اليوم</h2><div id="today-lesson" class="today-lesson"></div></div>
      <div class="card"><h2>📊 المستويات</h2>
        <div class="levels-progress">
          <div class="level-item" onclick="filterLessons('a1');showSection('lessons')"><div class="level-header"><span class="level-badge a1">A1</span><span id="a1-percent">0%</span></div><div class="progress-bar small"><div class="progress-fill" id="a1-bar" style="width:0%"></div></div></div>
          <div class="level-item" onclick="filterLessons('a2');showSection('lessons')"><div class="level-header"><span class="level-badge a2">A2</span><span id="a2-percent">0%</span></div><div class="progress-bar small"><div class="progress-fill" id="a2-bar" style="width:0%"></div></div></div>
          <div class="level-item" onclick="filterLessons('b1');showSection('lessons')"><div class="level-header"><span class="level-badge b1">B1</span><span id="b1-percent">0%</span></div><div class="progress-bar small"><div class="progress-fill" id="b1-bar" style="width:0%"></div></div></div>
          <div class="level-item" onclick="filterLessons('b2');showSection('lessons')"><div class="level-header"><span class="level-badge b2">B2</span><span id="b2-percent">0%</span></div><div class="progress-bar small"><div class="progress-fill" id="b2-bar" style="width:0%"></div></div></div>
        </div>
      </div>
      <div class="card"><h2>🃏 بنك</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" style="flex:1" onclick="showWordbankTab('vocab');showSection('wordbank')">مفردات</button><button class="btn" style="flex:1;background:#2980b9;color:#fff" onclick="showWordbankTab('sentences');showSection('wordbank')">جمل</button></div>
      </div>
    </section>
    <section id="lessons" class="section"><div class="tabs"><button class="tab-btn active" data-level="a1" onclick="filterLessons('a1')">A1</button><button class="tab-btn" data-level="a2" onclick="filterLessons('a2')">A2</button><button class="tab-btn" data-level="b1" onclick="filterLessons('b1')">B1</button><button class="tab-btn" data-level="b2" onclick="filterLessons('b2')">B2</button></div><div id="lessons-list" class="lessons-list"></div></section>
    <section id="lesson-view" class="section"><button class="btn-back" onclick="showSection('lessons')">← رجوع</button><div class="lesson-header"><span class="level-badge" id="lv-badge">A1</span><h1 id="lv-title"></h1></div><div id="lesson-content" class="lesson-content"></div><button id="mark-complete-btn" class="btn btn-primary" style="width:100%;margin-top:20px">✓ أكملت</button></section>
    <section id="stories" class="section"><div class="card"><h1>📖 قراءة</h1><div class="level-tabs"><button class="tab-btn active" data-story-level="a1" onclick="filterStories('a1')">A1</button><button class="tab-btn" data-story-level="a2" onclick="filterStories('a2')">A2</button><button class="tab-btn" data-story-level="b1" onclick="filterStories('b1')">B1</button><button class="tab-btn" data-story-level="b2" onclick="filterStories('b2')">B2</button></div><div id="stories-list"></div></div></section>
    <section id="story-view" class="section"><button class="btn-back" onclick="showSection('stories')">← رجوع</button><div class="lesson-header"><span class="level-badge" id="sv-badge">A1</span><h1 id="sv-title"></h1></div><div id="story-content" class="lesson-content"></div></section>
    <section id="redemittel" class="section"><h2>💬 عبارات</h2><div class="tabs"><button class="tab-btn active" data-rm="a1" onclick="filterRedemittel('a1')">A1</button><button class="tab-btn" data-rm="a2" onclick="filterRedemittel('a2')">A2</button><button class="tab-btn" data-rm="b1" onclick="filterRedemittel('b1')">B1</button><button class="tab-btn" data-rm="b2" onclick="filterRedemittel('b2')">B2</button></div><div id="redemittel-list"></div></section>
    <section id="exams" class="section"><div class="card"><h1>📝 امتحانات</h1><div class="level-tabs"><button class="tab-btn active" data-exam-level="a1" onclick="filterExams('a1')">A1</button><button class="tab-btn" data-exam-level="a2" onclick="filterExams('a2')">A2</button><button class="tab-btn" data-exam-level="b1" onclick="filterExams('b1')">B1</button><button class="tab-btn" data-exam-level="b2" onclick="filterExams('b2')">B2</button></div><div id="exams-list"></div></div></section>
    <section id="exam-view" class="section"><button class="btn-back" onclick="showSection('exams')">← رجوع</button><div class="lesson-header"><span class="level-badge" id="ev-badge">A1</span><h1 id="ev-title"></h1></div><div id="exam-content" class="lesson-content"></div></section>
    <section id="resources" class="section"><div class="card"><h1>🔗 موارد</h1><a class="resource-item" href="https://www.goethe.de" target="_blank">Goethe-Institut</a></div></section>
    <section id="wordbank" class="section"><h2>🃏 بنك</h2><div class="tabs"><button class="tab-btn active" id="wb-tab-vocab" onclick="showWordbankTab('vocab')">مفردات</button><button class="tab-btn" id="wb-tab-sentences" onclick="showWordbankTab('sentences')">جمل</button></div><div id="wordbank-vocab"><div id="vocab-cats-list"></div><div id="vocab-cards-view" class="hidden"><button class="btn-back" onclick="closeVocabCards()">← رجوع</button><h3 id="vocab-cat-title"></h3><div id="vocab-cards" class="vocab-cards-grid"></div></div></div><div id="wordbank-sentences" class="hidden"><div id="sentences-cats-list"></div><div id="sentences-list-view" class="hidden"><button class="btn-back" onclick="closeSentencesList()">← رجوع</button><h3 id="sentences-cat-title"></h3><div id="sentences-items"></div></div></div></section>
    <section id="scan" class="section"><h2>🔍 Scan</h2><div class="card"><textarea id="scan-input" rows="3" placeholder="نص ألماني..." style="width:100%;padding:12px;direction:ltr"></textarea><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="analyzeGermanText()">تحليل</button><div id="scan-errors-box" class="hidden"><div id="scan-highlighted"></div><div id="scan-corrections"></div></div></div></section>
  </main>
  <script src="lessons.js?v=12"></script>
  <script src="stories.js?v=12"></script>
  <script src="exams.js?v=12"></script>
  <script src="vocab-a1-ready.js?v=12"></script>
  <script src="sentences-a1-ready.js?v=12"></script>
  <script src="app.js?v=12"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})}).catch(function(){})}</script>
</body></html>
